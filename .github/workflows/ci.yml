name: CI

on:
  pull_request:
  push:
    branches: [main]

# Dos trabajos en paralelo (clase 13). Separados a propósito: si los tipos
# fallan, se sabe en un minuto sin esperar a compilar y levantar todo.
# En GitHub → Settings → Rulesets, los dos son obligatorios para mergear a main.
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        run: npx prisma generate

      - name: Chequeo de tipos
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Pruebas de dominio
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Una base nueva que nace con el trabajo y muere con él. Mismo puerto y
    # credenciales que .env.e2e, así la configuración es una sola.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gimnasio_e2e
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Flujo principal y permisos
        run: npm run test:e2e

      - name: Guardar el reporte si falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
